name: Supabase Keep-Alive

on:
  schedule:
    # Martes y viernes a las 12:00 UTC (09:00 hora Chile)
    - cron: '0 12 * * 2,5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/events?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          if [ "$response" -eq 200 ]; then
            echo "✅ Ping exitoso (HTTP $response)"
          else
            echo "❌ Ping falló (HTTP $response)"
            exit 1
          fi
